<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf2ff"><title>SpeakEasy · Conversation Lab</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25334a;background:#eff3fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#cbdcff,transparent 43%),radial-gradient(ellipse at 85% 20%,#e9d6ff,transparent 40%),radial-gradient(ellipse at 65% 95%,#cceee7,transparent 48%),#f4f6fc;background-attachment:fixed}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7da9e9;outline-offset:2px}.shell{display:grid;grid-template-columns:225px 290px minmax(0,1fr);height:100vh;gap:12px;padding:14px}.pane{background:#ffffffa6;border:1px solid #ffffffdf;backdrop-filter:blur(24px) saturate(155%);border-radius:23px;box-shadow:0 12px 38px #45577715;overflow:auto}.scenes,.questions{padding:22px 14px}.brand{font-size:26px;font-weight:850;letter-spacing:-1.2px;margin:5px 9px 4px}.brand span{color:#397cba}.sub{font-size:12px;color:#75839a;margin:0 9px 32px}.caption{font-size:11px;font-weight:800;color:#8b98ac;letter-spacing:1.5px;margin:0 9px 14px;text-transform:uppercase}.nav{width:100%;border:0;background:transparent;border-radius:13px;padding:14px 12px;text-align:left;color:#45546b;display:flex;align-items:center;gap:11px;margin-bottom:5px}.nav:hover,.nav.active{background:#fff;box-shadow:0 5px 17px #526b8d16;color:#275c99}.nav .count{margin-left:auto;color:#9aa5b6;font-size:12px}.questions .nav{display:block;line-height:1.4}.questions .nav small{display:block;color:#8592a5;margin-top:4px}.content{padding:clamp(22px,4vw,54px);min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.2px;color:#4775aa;text-transform:uppercase}.pill{font-size:12px;color:#627992;background:#ffffffa8;border:1px solid white;padding:8px 12px;border-radius:99px}.question{font-size:clamp(27px,3.6vw,46px);letter-spacing:-1.5px;margin:26px 0 8px;line-height:1.18}.zh{color:#8190a3;margin:0 0 24px}.practice{padding:24px;border-radius:22px;background:#ffffff8c;border:1px solid white;margin:20px 0;box-shadow:0 9px 25px #6b7a9512}.practice p{color:#6e7c91;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:1px solid #dce5f0;background:#fff;color:#355c88;padding:11px 15px;border-radius:12px;font-weight:650}.btn.primary{background:#3476bd;color:white;border-color:#3476bd}.btn:hover{filter:brightness(.97)}.answers{display:grid;gap:12px;margin-top:20px}.answer{background:#ffffffb8;border:1px solid #fff;border-radius:18px;padding:20px;box-shadow:0 7px 25px #58729212}.answer .type{font-size:12px;color:#517caf;font-weight:800;margin-bottom:9px}.answer .en{font-size:20px;font-weight:730;line-height:1.4}.answer .translation{color:#8190a3;font-size:14px;margin-top:7px}.answer .mini{margin-top:13px;padding:7px 10px;border-radius:10px;background:#eef4fc;border:0;color:#476d9a}.follow{margin-top:24px;padding:20px;border-radius:18px;background:#e7f0ffad;border:1px solid white}.follow strong{display:block;margin-bottom:9px}.follow p{margin:5px 0;color:#60718b}.foot{margin-top:30px;color:#8b98aa;font-size:12px}.search{width:100%;border:1px solid white;border-radius:12px;background:#ffffffb3;padding:11px;margin-bottom:18px}.empty{color:#8995a6;padding:20px}.mobiletitle{display:none}@media(max-width:900px){.shell{grid-template-columns:180px 220px minmax(0,1fr)}.content{padding:24px}.scenes,.questions{padding:18px 9px}}@media(max-width:700px){.shell{display:block;height:auto;padding:10px}.pane{margin-bottom:10px;overflow:visible}.scenes,.questions{padding:14px}.brand{margin:0 5px}.sub{margin:4px 5px 12px}.caption{margin:8px 5px}.sceneitems,.questionitems{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.nav{width:auto;flex-shrink:0;white-space:nowrap;margin:0;padding:11px}.questions .nav{max-width:230px;white-space:normal}.questions .nav small{display:none}.nav .count{display:none}.search{margin-bottom:10px}.content{padding:23px}.question{margin-top:18px}.answer .en{font-size:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div class="shell"><aside class="pane scenes"><div class="brand">speak<span>easy.</span></div><div class="sub">Conversation Lab · 场景反射训练</div><div class="caption">日常情景</div><div id="scenes" class="sceneitems"></div><p class="foot">🧩 <a href="./vocabulary.html">词根词缀记忆实验室</a> · 配图、例句与间隔复习</p><p class="foot">🌳 <a href="./families.html?v=2">3,000 高频词条 · 智能记忆方式</a></p><p class="foot">旧版每日10句仍可在 <a href="./legacy.html">经典学习模式</a> 中使用。</p></aside><aside class="pane questions"><div class="caption">情景问题</div><input class="search" id="search" placeholder="搜索当前情景的问题…" aria-label="搜索问题"><div id="questions" class="questionitems"></div></aside><main class="pane content" id="content" aria-live="polite"></main></div><script>
const BANK=[
{icon:"👋",name:"日常寒暄",items:[
["How's it going?","最近怎么样？",[["简短自然","Pretty good, thanks!","挺好的，谢谢！"],["有点疲惫","Not bad, just a little tired.","还行，就是有点累。"],["心情很好","Really good! It's been a great day.","非常好，今天很棒。"],["不太顺利","I've had better days, honestly.","说实话，今天不太顺利。"]],"How about you?","你呢？"],
["How was your weekend?","周末过得怎么样？",[["轻松休息","Pretty relaxing. I just stayed home.","挺放松的，我就在家待着。"],["忙碌","It was busy. I had a lot to do.","挺忙的，有很多事要做。"],["愉快","It was great! I met up with some friends.","很棒，我和朋友聚了聚。"]],"What did you get up to?","你都做了些什么？"],
["What have you been up to?","最近在忙什么？",[["简短","Not much, really.","其实没忙什么。"],["工作","Mostly just working.","基本都在工作。"],["展开","I've been pretty busy with work lately.","最近工作挺忙的。"]],"And you?","你呢？"],
["Did you sleep well?","昨晚睡得好吗？",[["睡得不错","Yeah, I slept really well.","嗯，睡得很好。"],["睡得不好","Not really. I didn't get much sleep.","不太好，我没怎么睡。"],["一般","It was okay, but I woke up early.","还行，不过醒得很早。"]],"How about you?","你呢？"]]},
{icon:"🍜",name:"餐厅点餐",items:[
["Are you ready to order?","准备好点餐了吗？",[["直接点餐","Yes, I'll have the chicken, please.","好的，我要鸡肉。"],["还没决定","Could I have another minute?","能再给我一分钟吗？"],["寻求推荐","What would you recommend?","你有什么推荐？"]],"Would you like anything to drink?","想喝点什么吗？"],
["How spicy would you like it?","想要多辣？",[["微辣","Just a little spicy, please.","微辣就好。"],["很辣","Make it really spicy, please.","请做得很辣。"],["不辣","Not spicy at all, please.","完全不要辣。"]],"Anything else?","还需要别的吗？"],
["Would you like anything else?","还需要别的吗？",[["不需要","No, that's all, thanks.","不用了，就这些，谢谢。"],["再加一道","Yes, could we also get some fries?","好的，可以再来份薯条吗？"],["考虑一下","Let me think for a second.","让我想一下。"]],"Is that for here or to go?","在这里吃还是带走？"]]},
{icon:"💻",name:"工作交流",items:[
["How's the project coming along?","项目进展怎么样？",[["进展顺利","It's going pretty smoothly.","进展挺顺利的。"],["遇到问题","I've run into a few issues.","我遇到了一些问题。"],["快完成","We're almost done with it.","我们快完成了。"]],"Is there anything I can help with?","有什么我能帮忙的吗？"],
["Can you take a look at this?","你能看一下这个吗？",[["答应","Sure, send it over.","当然，发给我吧。"],["稍后","Of course. Give me a few minutes.","当然，给我几分钟。"],["现在没空","I'm tied up right now. Can I check it later?","我现在忙着，晚点看可以吗？"]],"What do you think?","你觉得怎么样？"],
["When can you finish it?","你什么时候能完成？",[["今天","I should have it done by today.","我今天应该能完成。"],["明天","I can get it done by tomorrow.","我明天能完成。"],["不确定","I'm not sure yet. I'll keep you posted.","我还不确定，有进展会告诉你。"]],"Does that work for you?","这样可以吗？"]]},
{icon:"☕",name:"朋友聊天",items:[
["Any plans for the weekend?","周末有什么安排？",[["没计划","Nothing special, really.","没什么特别安排。"],["宅家","I'll probably just stay in.","我可能就在家待着。"],["约朋友","I'm thinking of meeting up with some friends.","我打算和朋友见见面。"]],"What about you?","你呢？"],
["What do you do for fun?","你平时喜欢做什么？",[["做饭","I really enjoy cooking.","我很喜欢做饭。"],["看动漫","I like watching anime in my free time.","空闲时我喜欢看动漫。"],["随意","It depends on my mood.","看心情。"]],"What about you?","你呢？"],
["Do you want to grab a coffee?","要不要一起喝杯咖啡？",[["答应","Sure, that sounds great!","当然，听起来不错！"],["婉拒","I'd love to, but I'm busy today.","我很想去，但今天有事。"],["改时间","Could we do it tomorrow instead?","我们改成明天可以吗？"]],"What time works for you?","你什么时候方便？"]]},
{icon:"🤝",name:"陌生人社交",items:[
["Is this your first time here?","你第一次来这里吗？",[["是的","Yeah, it's my first time.","对，我第一次来。"],["不是","No, I've been here a few times.","不是，我来过几次。"],["继续聊","Yeah! Do you come here often?","对！你经常来吗？"]],"How are you liking it so far?","目前感觉怎么样？"],
["Where are you from?","你来自哪里？",[["简单","I'm from China.","我来自中国。"],["现在住在这里","I'm from China, but I live here now.","我来自中国，不过现在住在这里。"],["反问","I'm from China. How about you?","我来自中国，你呢？"]],"How long have you been here?","你来这里多久了？"]]},
{icon:"🛒",name:"购物结账",items:[
["Can I help you find anything?","需要帮你找什么吗？",[["随便看看","I'm just looking, thanks.","我随便看看，谢谢。"],["寻求帮助","Yes, I'm looking for a jacket.","是的，我在找一件夹克。"],["询问尺码","Do you have this in a smaller size?","这件有小一点的尺码吗？"]],"What size are you looking for?","你想要什么尺码？"],
["Would you like a bag?","需要袋子吗？",[["需要","Yes, please.","好的，谢谢。"],["不需要","No thanks, I'm good.","不用了，谢谢。"],["询问收费","Is there an extra charge for it?","袋子需要另外收费吗？"]],"Would you like a receipt?","需要小票吗？"]]},
{icon:"🧭",name:"问路出行",items:[
["Do you know how to get to the station?","你知道怎么去车站吗？",[["知道","Yes, it's just around the corner.","知道，就在拐角附近。"],["不确定","Sorry, I'm not sure.","抱歉，我不太确定。"],["提供帮助","I can show you on the map.","我可以在地图上指给你看。"]],"Is it far from here?","离这里远吗？"],
["Is it far from here?","离这里远吗？",[["不远","No, it's about a five-minute walk.","不远，步行大概五分钟。"],["有点远","It's a bit far. You might want to take a taxi.","有点远，你可能需要打车。"],["不确定","I'm not sure how far it is.","我不确定有多远。"]],"Can I walk there?","我能走过去吗？"]]},
{icon:"💬",name:"表达观点",items:[
["What do you think about it?","你怎么看？",[["赞同","I think it's a good idea.","我觉得这是个好主意。"],["保留意见","I'm not sure about that.","我对此不太确定。"],["委婉反对","I see your point, but I disagree.","我理解你的观点，但我不赞同。"]],"Why do you think so?","你为什么这么想？"],
["Does that make sense?","这样说能理解吗？",[["理解","Yeah, that makes sense.","嗯，有道理。"],["请再解释","Could you explain that again?","能再解释一遍吗？"],["部分理解","I think so, but I'm still a bit confused.","我想是的，但还是有点困惑。"]],"Which part is confusing?","哪一部分让你困惑？"]]}
];
const state={scene:0,question:0,reveal:false,learned:JSON.parse(localStorage.getItem("speakeasy-conversation-learned")||"{}")};
const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function speak(text){if(!("speechSynthesis" in window)){alert("当前浏览器不支持语音播放");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}
function renderScenes(){ $("scenes").innerHTML=BANK.map((s,i)=>'<button class="nav '+(i===state.scene?'active':'')+'" data-scene="'+i+'"><span>'+s.icon+'</span><span>'+escapeHtml(s.name)+'</span><span class="count">'+s.items.length+'</span></button>').join("")}
function renderQuestions(){const term=$("search").value.toLowerCase().trim();const items=BANK[state.scene].items;$("questions").innerHTML=items.map((q,i)=>({q,i})).filter(x=>!term||(x.q[0]+" "+x.q[1]).toLowerCase().includes(term)).map(({q,i})=>'<button class="nav '+(i===state.question?'active':'')+'" data-question="'+i+'">'+escapeHtml(q[0])+'<small>'+escapeHtml(q[1])+'</small></button>').join("")||'<div class="empty">没有匹配的问题</div>'}
function renderContent(){const s=BANK[state.scene],q=s.items[state.question],key=state.scene+"-"+state.question,done=!!state.learned[key];$("content").innerHTML='<div class="top"><div class="eyebrow">'+s.icon+' '+escapeHtml(s.name)+' · Question '+(state.question+1)+'</div><span class="pill">'+Object.keys(state.learned).length+' 个问题已练习</span></div><h1 class="question">'+escapeHtml(q[0])+'</h1><p class="zh">'+escapeHtml(q[1])+'</p><div class="actions"><button class="btn" data-speak="'+escapeHtml(q[0])+'">🔊 听问题</button><button class="btn" id="next">下一个问题 →</button></div><section class="practice"><strong>先尝试自己回答</strong><p>不要急着看答案。试着在 3 秒内说出一句英语；卡住也没关系。</p><div class="actions"><button class="btn primary" id="reveal">'+(state.reveal?'🙈 隐藏参考回答':'✨ 查看不同类型的回答')+'</button><button class="btn" id="learned">'+(done?'✓ 已练习 · 点击取消':'○ 标记已练习')+'</button></div></section>'+(state.reveal?'<h2>不同类型的回答</h2><div class="answers">'+q[2].map(a=>'<article class="answer"><div class="type">'+escapeHtml(a[0])+'</div><div class="en">'+escapeHtml(a[1])+'</div><div class="translation">'+escapeHtml(a[2])+'</div><button class="mini" data-speak="'+escapeHtml(a[1])+'">🔊 听发音</button></article>').join("")+'</div><div class="follow"><strong>💬 继续对话</strong><p>'+escapeHtml(q[3])+'</p><p>'+escapeHtml(q[4])+'</p><button class="btn" data-speak="'+escapeHtml(q[3])+'">🔊 听追问</button></div>':'')+'<p class="foot">发音使用浏览器内置语音 · 练习进度仅保存在当前浏览器 · <a href="./legacy.html">返回经典模式</a></p>'}
function render(){renderScenes();renderQuestions();renderContent()}
$("scenes").addEventListener("click",e=>{const b=e.target.closest("[data-scene]");if(!b)return;state.scene=+b.dataset.scene;state.question=0;state.reveal=false;$("search").value="";render()});
$("questions").addEventListener("click",e=>{const b=e.target.closest("[data-question]");if(!b)return;state.question=+b.dataset.question;state.reveal=false;render()});
$("search").addEventListener("input",renderQuestions);
$("content").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-speak")){speak(b.dataset.speak);return}if(b.id==="reveal"){state.reveal=!state.reveal;renderContent()}if(b.id==="next"){state.question=(state.question+1)%BANK[state.scene].items.length;state.reveal=false;renderQuestions();renderContent()}if(b.id==="learned"){const k=state.scene+"-"+state.question;if(state.learned[k])delete state.learned[k];else state.learned[k]=true;localStorage.setItem("speakeasy-conversation-learned",JSON.stringify(state.learned));renderContent()}});
render();
</script></body></html>
