function speak(t,slow=false){if(!('speechSynthesis'in window)){toast('此浏览器不支持语音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=slow?.78:.94;u.pitch=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US'&&/natural|samantha|google|aria|jenny/i.test(v.name))||voices.find(v=>v.lang==='en-US')||null;speechSynthesis.speak(u)}
function nav(){document.getElementById('nav').innerHTML=[['home','⌂','首页概览'],['scenes','▦','场景分类'],['all','☷','全部表达'],['favorites','♡','我的收藏'],['study','▣','闪卡记忆']].map(([p,i,n])=>`<button class="nav ${state.page===p?'active':''}" onclick="go('${p}')">${i} &nbsp; ${n}</button>`).join('')+'<div style="margin:22px 10px 10px;color:#87958e;font-size:11px">13 个生活场景</div>'+scenes.map(s=>`<button class="nav ${state.scene===s.name&&state.page==='all'?'active':''}" onclick="chooseScene('${s.name}')">${s.icon} &nbsp; ${s.name}<small>${s.count}</small></button>`).join('')}
function go(p){state.page=p;state.onlyFav=p==='favorites';state.scene='全部';state.query='';render();window.scrollTo(0,0)}
function chooseScene(n){state.scene=n;state.page='all';state.onlyFav=false;state.query='';render();window.scrollTo(0,0)}
function filtered(){return DATA.filter(x=>(state.scene==='全部'||x.scene===state.scene)&&(!state.onlyFav||saved.favs.includes(x.id))&&(`${x.en} ${x.zh} ${x.scene}`.toLowerCase().includes(state.query.toLowerCase())))}
function card(x){const fav=saved.favs.includes(x.id);const level=saved.levels[x.id]||0;return `<article class="card"><div><div class="cardhead"><span class="pill">${x.icon} ${esc(x.scene)}</span><span class="small muted">${['未学习','学习中','已掌握'][level]}</span></div><div class="english">${esc(x.en)}</div><p class="chinese">${esc(x.zh)}</p></div><div class="actions"><button class="iconbtn" title="播放美式发音" onclick="play(${x.id})">🔊</button><button class="iconbtn" title="慢速跟读" onclick="play(${x.id},true)">🐢</button><button class="iconbtn ${fav?'fav':''}" title="收藏" onclick="favorite(${x.id})">${fav?'♥':'♡'}</button><button class="iconbtn" title="学习此句" onclick="startStudy(${x.id})">▣</button></div></article>`}
function play(id,slow=false){const x=DATA.find(x=>x.id===id);if(x)speak(x.en,slow)}
function favorite(id){saved.favs=saved.favs.includes(id)?saved.favs.filter(i=>i!==id):[...saved.favs,id];persist();render()}
function header(title,desc){return `<h1>${title}</h1><p>${desc}</p>`}
function toolbar(){return `<div class="tools"><input id="search" class="search" placeholder="⌕ 搜索英文、中文或场景…" value="${esc(state.query)}" oninput="state.query=this.value;updateResults()"><select class="filter" onchange="state.scene=this.value;updateResults()"><option value="全部">全部场景</option>${scenes.map(s=>`<option ${state.scene===s.name?'selected':''} value="${esc(s.name)}">${s.icon} ${esc(s.name)}</option>`).join('')}</select><button class="primary" onclick="startStudy()">开始记忆 →</button></div>`}
function updateResults(){const el=document.getElementById('results');if(el)el.innerHTML=filtered().length?filtered().map(card).join(''):'<div class="empty">没有找到匹配的表达。试试其他关键词吧。</div>';const n=document.getElementById('resultCount');if(n)n.textContent=filtered().length+' 条表达'}
function render(){nav();const app=document.getElementById('app');if(state.page==='study'){renderStudy();return}if(state.page==='scenes'){app.innerHTML=header('按场景学习','从你真实生活中会遇到的场景开始，先学会用，再记住句子。')+`<div class="scenegrid">${scenes.map(s=>`<button class="scenecard" onclick="chooseScene('${s.name}')"><div class="emoji">${s.icon}</div><b>${esc(s.name)}</b><small>${s.count} 个实用表达 →</small></button>`).join('')}</div>`;return}
let out='';if(state.page==='home'){const mastered=Object.values(saved.levels).filter(x=>x===2).length;out=`<div class="hero"><div><div class="eyebrow">LEARN IN CONTEXT · SPEAK WITH CONFIDENCE</div><h1>把英语，变成<br>你的自然反应。</h1><p>按真实生活场景学习，听美式发音、慢速跟读、翻卡回忆，让每一句都真正记得住。</p><button class="primary" onclick="startStudy()">开始今日练习 ↗</button><div class="stats"><div class="stat"><b>${DATA.length}</b><small>实用表达</small></div><div class="stat"><b>${scenes.length}</b><small>生活场景</small></div><div class="stat"><b>${mastered}</b><small>已掌握</small></div></div></div><div class="hero-art" aria-hidden="true">🗣️💬</div></div><div class="sectiontitle"><h2>探索生活场景</h2><button class="ghost" onclick="go('scenes')">查看全部 →</button></div><div class="scenegrid">${scenes.slice(0,6).map(s=>`<button class="scenecard" onclick="chooseScene('${s.name}')"><div class="emoji">${s.icon}</div><b>${esc(s.name)}</b><small>${s.count} 个表达 →</small></button>`).join('')}</div>`}
if(state.page==='all')out+=header(state.scene==='全部'?'全部口语表达':scenes.find(s=>s.name===state.scene).icon+' '+state.scene,'搜索你想说的话，点击喇叭听发音，收藏后集中复习。');if(state.page==='favorites')out+=header('我的收藏','把容易忘记、特别实用的句子放在这里反复练习。');if(state.page==='home')out+='<div class="sectiontitle"><h2>全部表达</h2><span class="muted small">听一听 · 跟读 · 收藏</span></div>';out+=toolbar()+`<div class="sectiontitle"><h2>表达清单</h2><span id="resultCount" class="muted small"></span></div><div id="results" class="cards"></div>`;app.innerHTML=out;updateResults()}
function startStudy(id){const pool=id?DATA.filter(x=>x.id===id):filtered();if(!pool.length){toast('当前没有可学习的句子');return}state.study=[...pool].sort((a,b)=>(saved.levels[a.id]||0)-(saved.levels[b.id]||0));state.index=0;state.flipped=false;state.quiz=false;state.page='study';render();window.scrollTo(0,0)}
function flip(){state.flipped=!state.flipped;renderStudy()}
function nextStudy(level){const x=state.study[state.index];if(!x)return;if(level!==undefined){saved.levels[x.id]=level; saved.seen[x.id]=(saved.seen[x.id]||0)+1;persist()}state.index++;state.flipped=false;renderStudy()}
function prevStudy(){state.index=Math.max(0,state.index-1);state.flipped=false;renderStudy()}
function renderStudy(){const app=document.getElementById('app');if(!state.study.length){state.study=DATA.slice(0,20);state.index=0}const x=state.study[state.index];if(!x){app.innerHTML=`<div class="study"><h1>今天练习完成！ 🎉</h1><p>已经过完 ${state.study.length} 张卡片。记不住的表达可以再次复习。</p><button class="primary" onclick="startStudy()">再练一轮</button> <button class="ghost" onclick="go('home')">返回首页</button></div>`;return}const pct=Math.round(state.index/state.study.length*100);app.innerHTML=`<div class="study"><div class="eyebrow">FLASHCARD PRACTICE</div><h1>场景闪卡记忆</h1><p>先看中文，尝试在 3 秒内说出英文，然后翻卡检查。不要先看答案。</p><div class="studybar"><span class="muted small">第 ${state.index+1} / ${state.study.length} 张</span><span class="pill">${x.icon} ${esc(x.scene)}</span><button onclick="go('all')">退出练习 ✕</button></div><div class="progress"><div style="width:${pct}%"></div></div><div class="studycard" onclick="flip()"><div class="bigemoji">${x.icon}</div><p>${state.flipped?'ENGLISH · 英语表达':'CHINESE · 先尝试说英语'}</p><h2>${esc(state.flipped?x.en:x.zh)}</h2>${state.flipped?`<p class="answer">${esc(x.zh)}</p>`:'<p class="muted">点击卡片翻面查看答案</p>'}</div><div class="studybar"><button onclick="prevStudy()" ${state.index===0?'disabled':''}>← 上一张</button><div><button onclick="speak(DATA.find(x=>x.id===${x.id}).en)">🔊 正常语速</button> <button onclick="speak(DATA.find(x=>x.id===${x.id}).en,true)">🐢 慢速</button></div></div>${state.flipped?`<div class="studybar"><button style="flex:1;background:#fff1ec;border-color:#f2d4c8" onclick="nextStudy(0)">😵 还不会</button><button style="flex:1;background:#fff8e8;border-color:#f0e2b7" onclick="nextStudy(1)">🤔 有点犹豫</button><button style="flex:1;background:#e6f3ec;border-color:#b6d9c6" onclick="nextStudy(2)">✨ 脱口而出</button></div>`:`<button class="primary" style="width:100%;margin-top:12px" onclick="flip()">查看英文答案 →</button>`}<p class="small muted">学习状态会自动保存在本机浏览器中。</p></div>`}
document.getElementById('resetFilters').onclick=()=>{state.query='';state.scene='全部';state.onlyFav=false;state.page='all';render()};document.addEventListener('keydown',e=>{if(state.page==='study'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.code==='Space'){e.preventDefault();flip()}if(e.code==='ArrowRight'&&state.flipped)nextStudy(1);if(e.code==='ArrowLeft')prevStudy()}});render();
</script></body></html>
