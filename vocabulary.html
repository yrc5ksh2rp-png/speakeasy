function day(){return new Date().toLocaleDateString("en-CA")}
function addDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function due(w){const p=state.progress[w.w];return p&&p.due<=day()}
function getPool(){
 let pool=WORDS.filter(w=>(state.group==="all"||w.group===state.group)&&(!state.search||[w.w,w.cn,w.why,...w.examples.flat()].join(" ").toLowerCase().includes(state.search)));
 if(state.mode==="review")pool=pool.filter(due);
 if(state.mode==="today"){const dueWords=pool.filter(due);const unseen=pool.filter(w=>!state.progress[w.w]);pool=[...dueWords,...unseen.slice(0,Math.max(0,5-dueWords.length))].slice(0,Math.max(5,dueWords.length))}
 return pool;
}

 const g=GROUPS.find(x=>x.id===w.group),tone={re:["#d4e9ff","#b4d3fc"],un:["#f0e3ff","#d7c7fb"],ful:["#d6f4e9","#b0e6d4"],less:["#ffe8df","#f6c8bf"],port:["#dfeeff","#bedaf5"],spect:["#eee8ff","#d7cbf8"]}[g.id];
 return '<svg role="img" aria-label="'+esc(w.cn)+'的记忆插画" viewBox="0 0 420 245" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg-'+w.w+'" x1="0" x2="1" y1="0" y2="1"><stop stop-color="'+tone[0]+'"/><stop offset="1" stop-color="'+tone[1]+'"/></linearGradient></defs><rect width="420" height="245" fill="url(#bg-'+w.w+')"/><circle cx="57" cy="52" r="75" fill="#fff" opacity=".22"/><circle cx="363" cy="204" r="91" fill="#fff" opacity=".22"/><path d="M45 226 Q210 208 375 226" stroke="#fff" opacity=".45" stroke-width="4" fill="none"/>'+icons[w.art]+'</svg>';
}
function stats(){const learned=WORDS.filter(w=>state.progress[w.w]&&state.progress[w.w].level>0).length,review=WORDS.filter(due).length;$("stats").innerHTML='<div class="metric"><strong>'+WORDS.length+'</strong><span>精选单词</span></div><div class="metric"><strong>'+learned+'</strong><span>已经学习</span></div><div class="metric"><strong>'+review+'</strong><span>待复习</span></div>'}
function roots(){
 $("roots").innerHTML='<button class="root-btn '+(state.group==="all"?"active":"")+'" data-group="all"><span class="root-name"><strong>全部词汇</strong><small>先少量掌握常用词</small></span><span class="count">'+WORDS.length+'</span></button>'+GROUPS.map(g=>'<button class="root-btn '+(state.group===g.id?"active":"")+'" data-group="'+g.id+'"><span class="root-name"><strong>'+esc(g.piece)+'</strong><small>'+esc(g.name)+'</small></span><span class="count">'+WORDS.filter(w=>w.group===g.id).length+'</span></button>').join("");
}
function renderCard(){
 const pool=getPool(),w=WORDS.find(x=>x.w===state.selected),found=w&&pool.some(x=>x.w===w.w);
 if(!found){$("card").innerHTML='<div class="glass empty"><strong>这里暂时没有单词</strong>试试「全部单词」或者切换词根分类。</div>';$("info").innerHTML="";return}
 const g=GROUPS.find(x=>x.id===w.group),p=state.progress[w.w],review=p&&p.due<=day();
 const breakdown=w.parts.map((part,i)=>'<span class="piece '+(i?"suffix":"")+'">'+esc(part)+'</span>'+(i<w.parts.length-1?'<span class="piece op">+</span>':"")).join("");
 $("card").innerHTML='<article class="glass word-card"><div class="picture">'+artSvg(w)+'</div><div class="word-body">'+(state.hidden?
 '<div class="eyebrow">回忆挑战 · 看中文说英文</div><div class="cue"><span>这张卡片的英文已暂时隐藏</span><strong>'+esc(w.cn)+'</strong><p>试着说出单词，再说一个包含它的日常句子。</p></div><div class="progress-actions"><button class="action primary" data-reveal="1">查看答案</button></div>':
 '<div class="word-header"><div><div class="eyebrow">'+esc(g.piece)+' · '+esc(g.kind)+'</div><div class="word-name">'+esc(w.w)+'</div><div class="phonetic">'+esc(w.ipa)+'</div></div><button class="speak" data-speak="'+esc(w.w)+'" aria-label="播放 '+esc(w.w)+' 的发音">🔊 发音</button></div><div class="chinese">'+esc(w.cn)+'</div><div class="breakdown">'+breakdown+'</div><div class="explainer">'+esc(w.why)+'</div><div class="divider"></div><h3 class="section-title">💬 日常交流中的用法</h3><div class="examples">'+w.examples.map(ex=>'<div class="example"><div><strong>'+esc(ex[0])+'</strong><small>'+esc(ex[1])+'</small></div><button class="mini" data-speak="'+esc(ex[0])+'" aria-label="播放例句">🔊</button></div>').join("")+'</div><div class="progress-actions"><button class="action" data-hide="1">🙈 遮住英文，自测一下</button><button class="action" data-grade="hard">还没记牢</button><button class="action primary" data-grade="easy">✓ 记住了</button></div><div class="feedback">'+(p?(review?'现在适合复习 · ':'已安排下次复习 · ')+'下次日期：'+esc(p.due):'第一次学习：先理解并开口练习，再标记“记住了”。')+'</div>')+(state.notice?'<div class="feedback" role="status">'+esc(state.notice)+'</div>':"")+'</div></article>';
 $("info").innerHTML='<section class="glass panel side-card"><h2>🔍 当前构词线索</h2><div class="root-big">'+esc(g.piece)+'</div><div class="eyebrow">'+esc(g.kind)+' · '+esc(g.name)+'</div><p>'+esc(g.note)+'</p><div class="tip"><b>记忆线索</b><div>'+esc(w.why)+'</div></div></section><section class="glass panel side-card"><h2>🧠 轻负担复习法</h2><p>① 看图理解意思</p><p>② 读一遍例句，尝试替换关键词</p><p>③ 遮住英文，尝试说出来</p><p>④ 用“记住了 / 还没记牢”安排下次复习</p><div class="prompt">图片是内置 SVG 语义插画；例句经过人工选取，无需加载图片 API。浏览器关闭后学习状态依旧保留在本机。</div></section>';
}
function render(){
 const pool=getPool();
 if(!pool.some(w=>w.w===state.selected))state.selected=pool.length?pool[0].w:null;
 stats();roots();
 document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));
 $("toolbar-note").textContent=state.mode==="today"?"到期优先，每次最多新增 5 个":"共 "+pool.length+" 个单词";
 $("word-strip").innerHTML=pool.map(w=>'<button class="word-chip '+(w.w===state.selected?"active":"")+'" data-word="'+w.w+'">'+esc(w.w)+'<small>'+esc(w.cn)+(due(w)?" · 待复习":"")+'</small></button>').join("");
 renderCard();
}
function grade(v){
 const w=state.selected,p=state.progress[w]||{level:0};
 const level=v==="easy"?Math.min(5,(p.level||0)+1):0;
 const days=v==="easy"?[1,3,7,14,30][level-1]||30:1;
 state.progress[w]={level:level,due:addDays(days)};
 try{localStorage.setItem(STORAGE,JSON.stringify(state.progress));state.notice=v==="easy"?"已安排 "+days+" 天后复习":"已安排明天再练一次"}catch(e){state.notice="此浏览器无法保存学习进度，请检查隐私设置"}
 state.hidden=false;render();
}
$("roots").addEventListener("click",e=>{const b=e.target.closest("[data-group]");if(!b)return;state.group=b.dataset.group;state.hidden=false;state.notice="";render()});
$("modes").addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(!b)return;state.mode=b.dataset.mode;state.hidden=false;state.notice="";render()});
$("word-strip").addEventListener("click",e=>{const b=e.target.closest("[data-word]");if(!b)return;state.selected=b.dataset.word;state.hidden=false;state.notice="";render()});
$("search").addEventListener("input",e=>{state.search=e.target.value.trim().toLowerCase();state.mode="all";state.hidden=false;render()});
$("card").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.speak){speak(b.dataset.speak)}else if(b.dataset.hide){state.hidden=true;renderCard()}else if(b.dataset.reveal){state.hidden=false;renderCard()}else if(b.dataset.grade){grade(b.dataset.grade)}});
render();
</script>
